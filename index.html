<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2-Minute Personalized Skincare & Gift Regimen Finder</title>
  <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-stone-50 text-stone-800 antialiased min-h-screen flex flex-col">
  <div id="app" class="max-w-3xl w-full mx-auto px-4 py-8 flex-1"></div>

  <script>
    const state = {
      step: 0,
      audience: "Daily Men's Skincare",
      skinType: "Normal / Combination",
      focus: "Quick 2-Step Essentials",
      complexity: "2-Minute Minimalist",
      portalUrl: localStorage.getItem("mk_portal_url") || "https://marykay.com",
      showSettings: false,
      copied: false
    };

    const steps = [
      { key: "audience", title: "Step 1: Who is this routine or gift for?", options: ["Daily Men's Skincare", "Women's Skincare Routine", "Ready-to-Wrap Gift Set"] },
      { key: "skinType", title: "Step 2: Select skin type", options: ["Dry / Sensitive", "Normal / Combination", "Oily / Blemish-Prone", "Not Sure"] },
      { key: "focus", title: "Step 3: Primary skin or gift goal", options: ["Hydration & Barrier Care", "Anti-Aging & Firmness", "Clear & Balanced Skin", "Quick 2-Step Essentials"] },
      { key: "complexity", title: "Step 4: Routine complexity", options: ["2-Minute Minimalist", "Complete 4-Step Regimen"] }
    ];

    function buildRecommendation() {
      const isMen = state.audience === "Daily Men's Skincare";
      const isGift = state.audience === "Ready-to-Wrap Gift Set";
      const isFull = state.complexity === "Complete 4-Step Regimen";

      const title = isGift
        ? `Curated ${state.focus} Gift Bundle (${state.complexity})`
        : `${isMen ? "Men's" : "Personalized"} ${state.focus} Routine`;

      const morning = isFull
        ? [
            `1. Gentle Daily Cleanser (${state.skinType} balanced formula)`,
            `2. Targeted Treatment Serum (${state.focus})`,
            `3. Lightweight Hydrating Moisturizer`,
            `4. Broad-Spectrum SPF 30 Daily Defense`
          ]
        : [
            `1. Refreshing 2-in-1 Daily Cleanser (${state.skinType})`,
            `2. Hydrating Daily Moisturizer with SPF 30`
          ];

      const evening = isFull
        ? [
            `1. Deep-Cleanse Facial Wash`,
            `2. ${state.focus} Recovery Serum`,
            `3. Eye & Barrier Replenishing Night Cream`
          ]
        : [
            `1. Evening Facial Cleanser`,
            `2. Barrier-Support Night Hydrator`
          ];

      const tip = state.skinType === "Oily / Blemish-Prone"
        ? "Look for non-comedogenic, oil-free gel hydrators that balance shine without stripping."
        : state.skinType === "Dry / Sensitive"
        ? "Prioritize fragrance-free ceramide and humectant formulas applied onto slightly damp skin."
        : "Consistent daily SPF in the morning and gentle cleansing at night drive 80% of visible results.";

      return { title, morning, evening, tip };
    }

    function render() {
      const root = document.getElementById("app");
      const progress = Math.round(((state.step + 1) / 5) * 100);
      const rec = buildRecommendation();

      root.innerHTML = `
        <header class="mb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 border-b border-stone-200 pb-4">
          <div>
            <span class="text-xs font-semibold uppercase tracking-widest text-rose-700">Automated Regimen & Gift Concierge</span>
            <h1 class="text-2xl font-bold text-stone-900 mt-1">2-Minute Skincare & Gift Finder</h1>
          </div>
          <button onclick="toggleSettings()" class="self-start sm:self-auto text-xs px-3 py-1.5 rounded-lg border border-stone-300 bg-white hover:bg-stone-100 text-stone-700 font-medium">
            ${state.showSettings ? "Close Settings" : "Consultant Portal Link"}
          </button>
        </header>

        ${state.showSettings ? `
          <div class="mb-6 p-4 rounded-xl bg-amber-50 border border-amber-200">
            <label class="block text-xs font-semibold text-amber-900 mb-1">Official Independent Beauty Consultant Portal URL</label>
            <div class="flex gap-2">
              <input id="portalInput" type="url" value="${state.portalUrl}" placeholder="https://marykay.com/yourname"
                class="flex-1 px-3 py-2 text-sm rounded-lg border border-amber-300 bg-white focus:outline-none" />
              <button onclick="saveUrl()" class="px-4 py-2 text-sm font-semibold rounded-lg bg-stone-900 text-white hover:bg-stone-800">
                Save URL
              </button>
            </div>
            <p class="text-xs text-amber-800 mt-1.5">Saved automatically in this browser. Update anytime once your consultant slug is active.</p>
          </div>
        ` : ""}

        <div class="mb-6 p-3.5 rounded-xl bg-rose-50/80 border border-rose-200 text-xs text-rose-950 leading-relaxed">
          <strong>Transparency Note:</strong> Recommendations are educational skincare and gift pairings. All product orders route directly through an authorized Independent Beauty Consultant portal—no checkout or payment data is collected on this page.
        </div>

        <div class="mb-6">
          <div class="flex justify-between text-xs font-medium text-stone-500 mb-1.5">
            <span>${state.step < 4 ? `Question ${state.step + 1} of 4` : "Your Personalized Match"}</span>
            <span>${progress}% Complete</span>
          </div>
          <div class="w-full bg-stone-200 rounded-full h-2">
            <div class="bg-rose-600 h-2 rounded-full transition-all duration-300" style="width: ${progress}%"></div>
          </div>
        </div>

        ${state.step < 4 ? `
          <div class="bg-white rounded-2xl shadow-sm border border-stone-200 p-6">
            <h2 class="text-lg font-semibold text-stone-900 mb-4">${steps[state.step].title}</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              ${steps[state.step].options.map(opt => {
                const active = state[steps[state.step].key] === opt;
                return `
                  <button onclick="selectOption('${steps[state.step].key}', '${opt.replace(/'/g, "\\'")}')"
                    class="text-left p-4 rounded-xl border text-sm font-medium transition ${
                      active ? "border-rose-600 bg-rose-50 text-rose-900" : "border-stone-200 hover:border-rose-300 bg-stone-50/50"
                    }">
                    ${opt}
                  </button>
                `;
              }).join("")}
            </div>
            <div class="mt-6 flex justify-between">
              <button onclick="prevStep()" ${state.step === 0 ? "disabled" : ""}
                class="px-4 py-2 text-sm rounded-lg border border-stone-300 text-stone-700 disabled:opacity-40">
                Back
              </button>
              <button onclick="nextStep()" class="px-5 py-2 text-sm font-semibold rounded-lg bg-stone-900 text-white hover:bg-stone-800">
                ${state.step === 3 ? "See My Regimen" : "Next Step"}
              </button>
            </div>
          </div>
        ` : `
          <div class="bg-white rounded-2xl shadow-sm border border-stone-200 p-6 space-y-5">
            <div>
              <span class="inline-block text-xs font-semibold px-2.5 py-1 rounded-full bg-rose-100 text-rose-800 mb-2">
                ${state.audience} • ${state.skinType}
              </span>
              <h2 class="text-xl font-bold text-stone-900">${rec.title}</h2>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="p-4 rounded-xl bg-stone-50 border border-stone-200">
                <h3 class="text-sm font-bold text-stone-900 mb-2">Morning Routine (AM)</h3>
                <ul class="space-y-1.5 text-sm text-stone-700">
                  ${rec.morning.map(item => `<li>${item}</li>`).join("")}
                </ul>
              </div>
              <div class="p-4 rounded-xl bg-stone-50 border border-stone-200">
                <h3 class="text-sm font-bold text-stone-900 mb-2">Evening Routine (PM)</h3>
                <ul class="space-y-1.5 text-sm text-stone-700">
                  ${rec.evening.map(item => `<li>${item}</li>`).join("")}
                </ul>
              </div>
            </div>

            <div class="p-3.5 rounded-xl bg-stone-100 text-xs text-stone-700">
              <strong>Pro Guidance:</strong> ${rec.tip}
            </div>

            <div class="flex flex-col sm:flex-row gap-3 pt-2">
              <a href="${state.portalUrl}" target="_blank" rel="noopener noreferrer"
                class="flex-1 text-center px-5 py-3 rounded-xl bg-rose-700 hover:bg-rose-800 text-white font-semibold text-sm shadow-sm">
                Shop Official Consultant Portal →
              </a>
              <button onclick="copySummary()" class="px-4 py-3 rounded-xl border border-stone-300 hover:bg-stone-100 text-sm font-medium text-stone-800">
                ${state.copied ? "Copied Routine!" : "Save My Routine"}
              </button>
              <button onclick="resetQuiz()" class="px-4 py-3 rounded-xl border border-stone-200 text-sm text-stone-500 hover:text-stone-800">
                Start Over
              </button>
            </div>
          </div>
        `}
      `;
    }

    window.selectOption = (key, val) => { state[key] = val; state.step++; render(); };
    window.nextStep = () => { state.step++; render(); };
    window.prevStep = () => { if (state.step > 0) state.step--; render(); };
    window.resetQuiz = () => { state.step = 0; state.copied = false; render(); };
    window.toggleSettings = () => { state.showSettings = !state.showSettings; render(); };
    window.saveUrl = () => {
      const val = document.getElementById("portalInput").value.trim();
